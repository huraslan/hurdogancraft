<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hürdoğan Craft | Satış Platformlarımız</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #efeee9; /* Görselin zemin rengiyle uyumlu */
        }
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: fill; /* Ekranı kenarlarda hiç boşluk bırakmadan tam doldurur */
            display: block;
            z-index: 1;
        }
        /* Görseldeki butonların üzerine tam oturan tıklanabilir alanlar */
        .store-link {
            position: absolute;
            bottom: 18.5%;
            height: 16.5%;
            border-radius: 14px;
            z-index: 2;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .store-link:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.28);
            background-color: rgba(255, 255, 255, 0.08);
        }
        .dolap {
            left: 11.8%;
            width: 24.2%;
        }
        .shopier {
            left: 37.9%;
            width: 24.2%;
        }
        .gardrops {
            left: 64.0%;
            width: 24.2%;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="arka-plan.jpg" alt="Hürdoğan Craft Satış Platformlarımız" class="bg-image">
        
        <a href="https://dolap.com/profil/hurdogancraft" target="_blank" rel="noopener noreferrer" class="store-link dolap" title="Dolap Mağazamıza Git"></a>
        <a href="https://www.shopier.com/hurdogancraft" target="_blank" rel="noopener noreferrer" class="store-link shopier" title="Shopier Dükkanımıza Git"></a>
        <a href="https://gardrops.com/hurdogancraft" target="_blank" rel="noopener noreferrer" class="store-link gardrops" title="Gardrops Mağazamıza Git"></a>
    </div>
</body>
</html>
