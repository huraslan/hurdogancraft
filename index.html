<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hürdoğan Outdoor / Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #111;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: block;
            background-color: #2563eb;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hürdoğan Outdoor</h1>
        <p>Mağaza ve platform bağlantılarımız</p>
        
        <div class="btn-container">
            <!-- Shopier Butonu -->
            <a href="https://www.shopier.com/hurdogancraft" class="btn" target="_blank">Shopier Mağazası</a>
            
            <!-- Gardrops Butonu -->
            <a href="https://www.gardrops.com/hurdogancraft" class="btn" target="_blank">Gardrops Mağazası</a>
            
            <!-- Dolap Butonu -->
            <a href="https://link.dolap.com/hyccwhri" class="btn" target="_blank">Dolap Mağazası</a>
        </div>
    </div>

</body>
</html>
