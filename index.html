<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yapım Aşamasında</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background-color: #121212; color: #e6e6e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px; text-align: center;
    }
    .box {
      max-width: 440px; width: 100%; padding: 36px 28px;
      border: 1px solid #262626; border-radius: 12px; background-color: #181818;
    }
    h1 { font-size: 1.35rem; font-weight: 600; margin-bottom: 12px; }
    p { font-size: 0.95rem; line-height: 1.6; color: #a8a8a8; }
  </style>
</head>
<body>
  <main class="box">
    <h1>Bu site yapım aşamasındadır</h1>
    <p>Şu an için sayfa yayına kapalıdır ve bağlantılar geçici olarak durdurulmuştur.</p>
  </main>
</body>
</html>
